# Benchmark copy of ether/etherpad's frontend-tests.yml: its 4 Playwright jobs (Chrome, Firefox,
# and both with plugins) as one matrix. Same steps and commit on every runner; only the test step
# differs. Upstream started Etherpad inside the test step; that is its own step here, on every
# runner. Retries and workers (2) come from src/playwright.config.ts with CI=true.
name: bench
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [boba-turbo, boba-standard, github-16, blacksmith-16, github-4, blacksmith-4]
permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read
jobs:
  frontend:
    name: ${{ matrix.name }} (${{ inputs.runner }})
    runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-16' && 'bench-16' || inputs.runner == 'github-4' && 'ubuntu-latest' || inputs.runner == 'blacksmith-4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Playwright Chrome, id: chrome, browser: chromium, project: chromium, plugins: '' }
          - { name: Playwright Firefox, id: firefox, browser: firefox, project: firefox, plugins: '' }
          - { name: Playwright Chrome with plugins, id: chrome-with-plugins, browser: chromium, project: chromium, plugins: '1' }
          - { name: Playwright Firefox with plugins, id: firefox-with-plugins, browser: firefox, project: firefox, plugins: '1' }
    env:
      PNPM_HOME: ~/.pnpm-store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Cache pnpm store
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/cache@v6
        name: Cache Playwright browsers
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - uses: pnpm/action-setup@v6.1.1
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install all dependencies and symlink for ep_etherpad-lite
        run: pnpm install --frozen-lockfile
      # Upstream's plugin set for the with-plugins jobs (ep_cursortrace left out, as upstream).
      - name: Install Etherpad plugins
        if: matrix.plugins == '1'
        run: >
          pnpm add -w
          ep_align
          ep_author_hover
          ep_font_color
          ep_font_size
          ep_hash_auth
          ep_headings2
          ep_markdown
          ep_guest
          ep_set_title_on_pad
          ep_spellcheck
          ep_subscript_and_superscript
          ep_table_of_contents
      - name: Create settings.json
        run: cp ./src/tests/settings.json settings.json
      - name: Start Etherpad
        shell: bash
        run: |
          set -euo pipefail
          pnpm run prod > /tmp/etherpad-server.log 2>&1 &
          can_connect() { curl --max-time 3 -sSfo /dev/null http://localhost:9001/; }
          for i in $(seq 1 90); do can_connect && break; sleep 1; done
          if ! can_connect; then
            echo "::error::Etherpad did not respond on :9001 within 90s"
            echo "----- server log -----"
            tail -n 200 /tmp/etherpad-server.log || true
            exit 1
          fi
          cd src
          pnpm exec playwright install ${{ matrix.browser }} --with-deps

      - name: Run the frontend tests on Boba
        if: startsWith(inputs.runner, 'boba')
        uses: coldteadotai/boba@v1
        with:
          working-directory: src
          project: ${{ matrix.project }}
          turbo: ${{ inputs.runner == 'boba-turbo' }}
          fail-fast: false
        env:
          NODE_ENV: production
          WITH_PLUGINS: ${{ matrix.plugins }}

      - name: Run the frontend tests
        if: ${{ !startsWith(inputs.runner, 'boba') }}
        working-directory: src
        run: pnpm run test-ui --project=${{ matrix.project }} --reporter=list,json
        env:
          WITH_PLUGINS: ${{ matrix.plugins }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/results.json

      - uses: actions/upload-artifact@v7
        if: ${{ always() && !startsWith(inputs.runner, 'boba') }}
        with:
          name: results-${{ inputs.runner }}-${{ matrix.id }}
          path: results.json
          retention-days: 30
      - name: Upload server log on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: server-log-${{ matrix.id }}
          path: /tmp/etherpad-server.log
          retention-days: 7
